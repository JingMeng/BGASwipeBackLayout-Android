apply plugin: 'com.android.application'

android {
    namespace 'cn.bingoogolapple.swipebacklayout.demo'
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    compileSdkVersion ANDROID_BUILD_SDK_VERSION as int

    defaultConfig {
        minSdkVersion ANDROID_BUILD_MIN_SDK_VERSION as int
        targetSdkVersion ANDROID_BUILD_TARGET_SDK_VERSION as int
        versionCode VERSION_CODE as int
        versionName VERSION_NAME
    }
}

dependencies {
    // ???????????????
    implementation 'com.android.support:support-v4:25.3.1'
    implementation 'cn.bingoogolapple:bga-swipebacklayout:1.1.3@aar'
    // ???????????????


//    compile project(':library')


    // ?????????????????????????????demo
    implementation 'cn.bingoogolapple:bga-adapter:1.2.0@aar'
    implementation 'cn.bingoogolapple:bga-refreshlayout:1.1.7@aar'
    implementation 'cn.bingoogolapple:bga-progressbar:1.0.0@aar'
    implementation 'cn.bingoogolapple:bga-swipeitemlayout:1.0.4@aar'
    implementation 'com.android.support:design:25.3.1'
    implementation 'com.android.support:palette-v7:25.3.1'
    implementation 'com.android.support:recyclerview-v7:25.3.1'
    implementation 'com.jaeger.statusbaruitl:library:1.4.0'
    debugImplementation 'com.squareup.leakcanary:leakcanary-android:1.5.4'
    releaseImplementation 'com.squareup.leakcanary:leakcanary-android-no-op:1.5.4'
}
